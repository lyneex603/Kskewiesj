  berserk:
    material: TOTEM_OF_UNDYING
    item-model: "totemspheres:talisman_berserk"
    name: "<dark_red>Талисман Берсерка"
    lore: ["<dark_gray>Держите в левой руке", "<dark_gray>Воскрешает при смерти"]
    stats: { damage: 4, speed: 15, health: -3, armor: -2 }
  smith:
    material: TOTEM_OF_UNDYING
    item-model: "totemspheres:talisman_smith"
    name: "<#c87832>Талисман Кузнеца"
    lore: ["<dark_gray>Держите в левой руке", "<dark_gray>Воскрешает при смерти"]
    stats: { armor: 2, damage: 2, health: -4 }
  dominator:
    material: TOTEM_OF_UNDYING
    item-model: "totemspheres:talisman_dominator"
    name: "<light_purple>Талисман Доминатора"
    lore: ["<dark_gray>Держите в левой руке", "<dark_gray>Воскрешает при смерти"]
    stats: { health: 4, damage: 4, armor: 2, speed: 15 }
  terpil:
    material: TOTEM_OF_UNDYING
    item-model: "totemspheres:talisman_terpil"
    name: "<blue>Талисман Терпил"
    lore: ["<dark_gray>Держите в левой руке", "<dark_gray>Воскрешает при смерти"]
    stats: { armor: 3, toughness: 3, speed: -15 }
  phantom:
    material: TOTEM_OF_UNDYING
    item-model: "totemspheres:talisman_phantom"
    name: "<aqua>Талисман Фантома"
    lore: ["<dark_gray>Держите в левой руке", "<dark_gray>Воскрешает при смерти"]
    stats: { damage: 3, speed: 10, armor: -1 }
  runner:
    material: TOTEM_OF_UNDYING
    item-model: "totemspheres:talisman_runner"
    name: "<green>Талисман Бегуна"
    lore: ["<dark_gray>Держите в левой руке", "<dark_gray>Воскрешает при смерти"]
    stats: { health: 2, armor: -3, speed: 40 }
